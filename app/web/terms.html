<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LHT Money</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1c2024; --muted:#60646c; --accent:#12a594; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b1f24; --fg:#edeef0; --muted:#9ba1a6; --accent:#3dd6c0; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  .card { background:var(--card); border-radius:12px; padding:20px 22px; margin-top:14px; }
  h1 { font-size:26px; margin:8px 0 4px; } h2 { font-size:17px; margin:0 0 6px; color:var(--accent); }
  .muted { color:var(--muted); font-size:14px; } p { margin:0; white-space:pre-line; }
  nav a { color:var(--accent); text-decoration:none; margin-right:16px; font-weight:600; }
</style>
</head>
<body>
<main>
  <nav><a href="privacy.html">Quyền riêng tư</a><a href="terms.html">Điều khoản sử dụng</a></nav>
  <h1 id="title">…</h1>
  <div class="muted" id="meta"></div>
  <div class="card"><p id="intro"></p></div>
  <div id="sections"></div>
</main>
<script>
  // Cùng nội dung với trang trong app (assets/legal/legal.json)
  fetch('assets/assets/legal/legal.json').then(r => r.json()).then(d => {
    const doc = d['terms'];
    const fill = s => s.replaceAll('{contact}', d.contact);
    document.title = doc.title + ' · ' + d.appName;
    document.getElementById('title').textContent = doc.title;
    document.getElementById('meta').textContent = d.appName + ' · Cập nhật ' + d.updated;
    document.getElementById('intro').textContent = fill(doc.intro);
    const box = document.getElementById('sections');
    for (const s of doc.sections) {
      const c = document.createElement('div'); c.className = 'card';
      const h = document.createElement('h2'); h.textContent = s.title;
      const p = document.createElement('p'); p.textContent = fill(s.body);
      c.append(h, p); box.append(c);
    }
  });
</script>
</body>
</html>
