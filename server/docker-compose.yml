# SQL Server chạy tạm trên Docker cho môi trường dev.
# Chạy:  docker compose up -d   (đọc mật khẩu từ file .env cùng thư mục)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lht-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - lht-sqldata:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  lht-sqldata:
